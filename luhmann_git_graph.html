<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卢曼笔记 · git 式分支图</title>
<style>
  :root{
    --bg:#FAF8F4; --ink:#33475B; --sub:#8A97A6; --line:#B9C4CF;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:24px; background:var(--bg); color:var(--ink);
    font-family:'WenQuanYi Micro Hei','PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif;
  }
  .bar{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    margin:0 auto 16px; max-width:1180px;
  }
  button{
    font:inherit; font-size:14px; padding:8px 16px; border-radius:999px;
    border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
  }
  button:hover{border-color:#5B87A8; color:#5B87A8}
  button.on{background:#3A6B8A; border-color:#3A6B8A; color:#fff}
  .hint{font-size:13px; color:var(--sub)}
  #wrap{max-width:1180px; margin:0 auto; background:#fff; border-radius:14px;
        border:1px solid #E8E2D8; padding:8px; overflow:auto}
  svg{display:block}
</style>
</head>
<body>

<div class="bar">
  <button id="btnV" class="on">纵向</button>
  <button id="btnH">横向</button>
  <button id="btnPng">导出 PNG</button>
  <span class="hint">圆点＝一张卡片　实线＝一条思路线索　虚线＝跨分支跳线</span>
</div>

<div id="wrap"><svg id="chart"></svg></div>

<script>
/* ============ 1. 数据：只改这里就能画出你自己的卡片盒 ============ */
const LANE = {
  main:{name:'主干', color:'#3A6B8A'},
  A:{name:'泳道 A', color:'#6E9B77'},
  B:{name:'泳道 B', color:'#D99A4E'},
  C:{name:'泳道 C', color:'#5B87A8'},
  solo:{name:'孤立', color:'#9AA5B1'}
};

// t = 时间顺序(从 0 起，对应 t1,t2...)；x = 泳道序号(决定并排位置)
const NODES = [
  {id:'21',      t:0,   x:1,   lane:'main', label:'21 沟通理论'},
  {id:'21/3',    t:1,   x:1,   lane:'main', label:'21/3 沟通的三重选择性'},
  {id:'21/3a',   t:2,   x:0,   lane:'A',    label:'21/3a 信息的选择'},
  {id:'21/3b',   t:2,   x:1,   lane:'B',    label:'21/3b 告知的选择', stop:true},
  {id:'21/3c',   t:2,   x:2,   lane:'C',    label:'21/3c 理解的选择'},
  {id:'21/3a1',  t:3,   x:0,   lane:'A',    label:'21/3a1 信息与告知的区分'},
  {id:'21/3c1',  t:3,   x:2,   lane:'C',    label:'21/3c1 误解是常态'},
  {id:'21/3a1p', t:4,   x:0,   lane:'A',    label:'21/3a1p 告知的再进入'},
  {id:'21/3c2',  t:4,   x:2,   lane:'C',    label:'21/3c2 理解作为递归'},
  {id:'9/8b',    t:4.6, x:3.4, lane:'solo', label:'9/8b 系统与环境', solo:true}
];

// 父子边：只有 isFork=true 的才是“分叉”，其余是同泳道续接
const EDGES = [
  {from:'21',      to:'21/3'},
  {from:'21/3',    to:'21/3a',   isFork:true},
  {from:'21/3',    to:'21/3b',   isFork:true},
  {from:'21/3',    to:'21/3c',   isFork:true},
  {from:'21/3a',   to:'21/3a1'},
  {from:'21/3a1',  to:'21/3a1p'},
  {from:'21/3c',   to:'21/3c1'},
  {from:'21/3c1',  to:'21/3c2'}
];

// 跳线：跨分支引用，一定画成虚线
const JUMPS = [
  {from:'21/3a1p', to:'21/3c1', label:'跳线'},
  {from:'21/3c2',  to:'9/8b',   label:'引用旧笔记'}
];

const TITLE = '卢曼笔记 · git 式分支图';

/* ============ 2. 渲染 ============ */
const NS='http://www.w3.org/2000/svg';
const R=8, SOLO_R=6.5;

function el(tag, attrs, text){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  if(text!=null) n.textContent=text;
  return n;
}
function txt(x,y,s,o={}){
  const t=el('text',{
    x, y, fill:o.fill||'#33475B',
    'font-size':o.size||13,
    'font-weight':o.weight||400,
    'text-anchor':o.anchor||'start',
    'dominant-baseline':o.baseline||'middle',
    'paint-order':'stroke fill', stroke:'#FFFFFF',
    'stroke-width':o.halo||4, 'stroke-linejoin':'round'
  }, s);
  return t;
}

function render(vertical){
  const svg=document.getElementById('chart');
  svg.innerHTML='';
  const map={}; NODES.forEach(n=>map[n.id]=n);

  /* --- 布局：纵向 t→y、x→泳道列；横向两者互换 --- */
  const P = vertical
    ? {xBase:200, colW:170, yBase:135, rowH:100, axisX:62,  w:1010, soloLane:null}
    : {xBase:150, colW:168, yBase:165, rowH:118, axisY:95,  w:1080, soloLane:3.0};

  const pos = n => vertical
    ? {x: P.xBase + n.x*P.colW,       y: P.yBase + n.t*P.rowH}
    : {x: P.xBase + n.t*P.colW,       y: P.yBase + (n.solo ? P.soloLane : n.x)*P.rowH};

  const maxT = Math.max(...NODES.map(n=>n.t));
  const bottom = vertical ? P.yBase + maxT*P.rowH : P.yBase + P.soloLane*P.rowH;
  const right  = vertical ? P.xBase + 3.4*P.colW  : P.xBase + maxT*P.colW;
  const H = (vertical ? bottom + 210 : bottom + 200);
  svg.setAttribute('width', P.w); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${P.w} ${H}`);

  /* --- 定义：淡出渐变 --- */
  const defs=el('defs');
  ['A','B','C','main'].forEach(k=>{
    const g=el('linearGradient',{id:'fade'+k,
      x1:'0',y1:'0',x2: vertical?'0':'1', y2: vertical?'1':'0'});
    g.appendChild(el('stop',{offset:'0%','stop-color':LANE[k].color,'stop-opacity':'0.9'}));
    g.appendChild(el('stop',{offset:'100%','stop-color':LANE[k].color,'stop-opacity':'0'}));
    defs.appendChild(g);
  });
  svg.appendChild(defs);

  /* --- 标题 --- */
  svg.appendChild(txt(P.w/2, 46, TITLE, {size:27, weight:700, anchor:'middle'}));
  const sub = vertical ? '纵向：自上而下 = 时间推进　泳道 = 一条思路线索' 
                       : '横向：从左到右 = 时间推进　泳道 = 一条思路线索';
  svg.appendChild(txt(P.w/2, 78, sub, {size:14, fill:'#8A97A6', anchor:'middle'}));
  svg.appendChild(el('line',{x1:P.w/2-60,y1:96,x2:P.w/2+60,y2:96,stroke:'#D6DDE4','stroke-width':1.5}));
  const tag=el('rect',{x:P.w-158,y:32,width:126,height:30,rx:15,fill:'#E0A458'});
  svg.appendChild(tag);
  svg.appendChild(txt(P.w-95, 48, 'Zettelkasten', {size:13, weight:600, fill:'#fff', anchor:'middle', halo:0}));

  /* --- 时间轴 --- */
  const axisG=el('g');
  if(vertical){
    axisG.appendChild(el('line',{x1:P.axisX,y1:P.yBase-30,x2:P.axisX,y2:bottom+40,
      stroke:'#C6CFD8','stroke-width':1.5,'stroke-dasharray':'4 5'}));
    axisG.appendChild(txt(P.axisX, P.yBase-48,'↓ 时间',{size:12,fill:'#8A97A6',anchor:'middle'}));
  }else{
    axisG.appendChild(el('line',{x1:P.xBase-40,y1:P.axisY,x2:right+70,y2:P.axisY,
      stroke:'#C6CFD8','stroke-width':1.5,'stroke-dasharray':'4 5'}));
    axisG.appendChild(txt(P.xBase-56, P.axisY,'时间 →',{size:12,fill:'#8A97A6',anchor:'end'}));
  }
  for(let i=0;i<=Math.floor(maxT);i++){
    const label='t'+(i+1);
    if(vertical){
      const y=P.yBase+i*P.rowH;
      axisG.appendChild(el('line',{x1:P.axisX-5,y1:y,x2:P.axisX+5,y2:y,stroke:'#C6CFD8','stroke-width':1.5}));
      axisG.appendChild(txt(P.axisX-12, y, label, {size:12, fill:'#8A97A6', anchor:'end'}));
    }else{
      const x=P.xBase+i*P.colW;
      axisG.appendChild(el('line',{x1:x,y1:P.axisY-5,x2:x,y2:P.axisY+5,stroke:'#C6CFD8','stroke-width':1.5}));
      axisG.appendChild(txt(x, P.axisY-16, label, {size:12, fill:'#8A97A6', anchor:'middle'}));
    }
  }
  svg.appendChild(axisG);

  /* --- 实线：父子 / 分叉 --- */
  const edgeG=el('g');
  EDGES.forEach(e=>{
    const a=pos(map[e.from]), b=pos(map[e.to]);
    const c=LANE[map[e.to].lane].color;
    let d;
    if(vertical){
      const dy=b.y-a.y;
      d=`M${a.x},${a.y+R} C${a.x},${a.y+dy*0.45} ${b.x},${b.y-dy*0.45} ${b.x},${b.y-R}`;
    }else{
      const dx=b.x-a.x;
      d=`M${a.x+R},${a.y} C${a.x+dx*0.45},${a.y} ${b.x-dx*0.45},${b.y} ${b.x-R},${b.y}`;
    }
    edgeG.appendChild(el('path',{d, fill:'none', stroke:c,
      'stroke-width': e.isFork?2.4:3, 'stroke-linecap':'round', opacity:0.95}));
  });
  svg.appendChild(edgeG);

  /* --- 停止生长的泳道：末端淡出 --- */
  NODES.filter(n=>n.stop).forEach(n=>{
    const p=pos(n), c=LANE[n.lane].color;
    const g=el('g');
    if(vertical){
      g.appendChild(el('line',{x1:p.x,y1:p.y+R,x2:p.x,y2:p.y+R+70,
        stroke:`url(#fade${n.lane})`,'stroke-width':3,'stroke-linecap':'round'}));
      g.appendChild(txt(p.x-14, p.y+R+56,'思路停止',{size:11,fill:'#A7B2BD',anchor:'end'}));
    }else{
      g.appendChild(el('line',{x1:p.x+R,y1:p.y,x2:p.x+R+80,y2:p.y,
        stroke:`url(#fade${n.lane})`,'stroke-width':3,'stroke-linecap':'round'}));
      g.appendChild(txt(p.x+R+88, p.y,'思路停止',{size:11,fill:'#A7B2BD',anchor:'start'}));
    }
    svg.appendChild(g);
  });

  /* --- 虚线：跳线 --- */
  const jumpG=el('g');
  JUMPS.forEach(j=>{
    const a=pos(map[j.from]), b=pos(map[j.to]);
    let d, mx, my;
    if(vertical){
      const sx=(a.x+b.x)/2, sy=(a.y+b.y)/2;
      d=`M${a.x},${a.y} Q${sx},${sy-46} ${b.x},${b.y}`;
      mx=sx; my=sy-24;
    }else{
      const sx=(a.x+b.x)/2, sy=(a.y+b.y)/2;
      d=`M${a.x},${a.y} Q${sx-10},${sy} ${b.x},${b.y}`;
      mx=sx-6; my=sy;
    }
    jumpG.appendChild(el('path',{d, fill:'none', stroke:'#9AA5B1',
      'stroke-width':2,'stroke-dasharray':'6 5','stroke-linecap':'round'}));
    jumArrow(jumpG, a, b, map[j.to]);
    jumpG.appendChild(txt(mx, my, j.label, {size:11, fill:'#8A97A6', anchor:'middle'}));
  });
  svg.appendChild(jumpG);

  function jumArrow(g,a,b,target){
    const rad=target.solo?SOLO_R:R;
    const ang=Math.atan2(b.y-a.y, b.x-a.x);
    const tipX=b.x-Math.cos(ang)*(rad+4), tipY=b.y-Math.sin(ang)*(rad+4);
    const s=6, spread=0.42;
    const p1=[tipX-s*Math.cos(ang-spread), tipY-s*Math.sin(ang-spread)];
    const p2=[tipX-s*Math.cos(ang+spread), tipY-s*Math.sin(ang+spread)];
    g.appendChild(el('path',{d:`M${p1[0]},${p1[1]} L${tipX},${tipY} L${p2[0]},${p2[1]}`,
      fill:'none',stroke:'#9AA5B1','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'}));
  }

  /* --- 圆点与标签 --- */
  const nodeG=el('g');
  NODES.forEach(n=>{
    const p=pos(n), c=LANE[n.lane].color, r=n.solo?SOLO_R:R;
    if(n.solo){
      nodeG.appendChild(el('circle',{cx:p.x,cy:p.y,r,fill:'#fff',stroke:c,'stroke-width':2.5}));
      nodeG.appendChild(el('circle',{cx:p.x,cy:p.y,r:2,fill:c}));
    }else{
      nodeG.appendChild(el('circle',{cx:p.x,cy:p.y,r:r+4,fill:c,opacity:0.14}));
      nodeG.appendChild(el('circle',{cx:p.x,cy:p.y,r,fill:c,stroke:'#fff','stroke-width':2}));
    }
    if(vertical){
      nodeG.appendChild(txt(p.x+18, p.y, n.label, {size:13.5, weight:600, fill:n.solo?'#7A8794':'#33475B'}));
    }else{
      nodeG.appendChild(txt(p.x, p.y-22, n.label, {size:13.5, weight:600,
        fill:n.solo?'#7A8794':'#33475B', anchor:'middle'}));
    }
  });
  svg.appendChild(nodeG);

  /* --- 图例 --- */
  const ly = H - 96;
  const lg=el('g');
  lg.appendChild(el('rect',{x:40,y:ly-26,width:P.w-80,height:78,rx:12,fill:'#F4F2EC',stroke:'#E8E2D8'}));
  const items=[
    ['dot','实心圆点','＝ 一张卡片笔记（commit）'],
    ['lane','一条实线','＝ 一条思路线索（branch）'],
    ['fork','Y 形分叉','＝ 回到父节点，另起新枝'],
    ['jump','斜向虚线','＝ 跳线，跨分支引用']
  ];
  const colW=(P.w-120)/4;
  items.forEach((it,i)=>{
    const x=62+i*colW;
    lg.appendChild(icon(it[0], x+16, ly+13));
    lg.appendChild(txt(x+34, ly-2, it[1], {size:12.5, weight:600}));
    lg.appendChild(txt(x+34, ly+20, it[2], {size:12, fill:'#8A97A6'}));
  });
  svg.appendChild(lg);

  function icon(kind,cx,cy){
    const g=el('g');
    if(kind==='dot'){
      g.appendChild(el('circle',{cx,cy:cy-8,r:7,fill:'#5B87A8'}));
    }else if(kind==='lane'){
      g.appendChild(el('line',{x1:cx,y1:cy-16,x2:cx,y2:cy,stroke:'#5B87A8','stroke-width':3,'stroke-linecap':'round'}));
    }else if(kind==='fork'){
      g.appendChild(el('path',{d:`M${cx},${cy-16} L${cx},${cy-4} M${cx},${cy-4} L${cx-9},${cy+2} M${cx},${cy-4} L${cx+9},${cy+2}`,
        fill:'none',stroke:'#6E9B77','stroke-width':2.6,'stroke-linecap':'round'}));
    }else{
      g.appendChild(el('path',{d:`M${cx-11},${cy-14} Q${cx},${cy-4} ${cx+11},${cy+2}`,
        fill:'none',stroke:'#9AA5B1','stroke-width':2,'stroke-dasharray':'5 4'}));
    }
    return g;
  }

  /* --- 总结条 --- */
  const sy=H-26;
  svg.appendChild(el('rect',{x:40,y:sy-18,width:P.w-80,height:36,rx:18,fill:'#EAF0F4'}));
  svg.appendChild(txt(P.w/2, sy, '比树形图多表达三件事：时间轴 · 兄弟关系 · 跨分支跳线', 
    {size:13.5, weight:600, anchor:'middle', halo:0}));
}

/* ============ 3. 交互 ============ */
let vertical=true;
const bv=document.getElementById('btnV'), bh=document.getElementById('btnH');
bv.onclick=()=>{vertical=true;  bv.classList.add('on'); bh.classList.remove('on'); render(true);};
bh.onclick=()=>{vertical=false; bh.classList.add('on'); bv.classList.remove('on'); render(false);};

document.getElementById('btnPng').onclick=()=>{
  const svg=document.getElementById('chart');
  const s=new XMLSerializer().serializeToString(svg);
  const blob=new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+s],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=(vertical?'卢曼git分支图-纵向':'卢曼git分支图-横向')+'.svg';
  a.click(); URL.revokeObjectURL(url);
};

render(true);
</script>
</body>
</html>
